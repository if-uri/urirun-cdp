[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urirun-cdp"
version = "0.2.0"
description = "Meta-package: CDP (Chrome DevTools Protocol) browser-surface primitive for urirun. The `urirun_cdp` import package now ships inside the `urirun` distribution (the single source of truth); this distribution just depends on it so `pip install urirun-cdp` and `import urirun_cdp` keep working."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
# Meta-package: ships NO import package of its own (the bundled `urirun` owns `urirun_cdp`),
# so installing this alongside `urirun` cannot shadow the bundle copy.
dependencies = ["urirun>=0.4.186"]

[tool.setuptools]
packages = []                # meta-package — no import package shipped
