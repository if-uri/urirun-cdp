[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urirun-cdp"
version = "0.1.0"
description = "CDP (Chrome DevTools Protocol) browser-surface primitive for urirun — reachable/navigate/evaluate over a raw WebSocket. Pure stdlib, no urirun dependency."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
